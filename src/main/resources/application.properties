# =============================================================================
# Hype Advice - Configuracao da aplicacao
# =============================================================================

# -----------------------------------------------------------------------------
# Jackson (serializacao JSON)
# -----------------------------------------------------------------------------
# Formato padrao para datas serializadas/deserializadas em endpoints REST
spring.jackson.date-format=dd/MM/yyyy HH:mm:ss
# Inclui campos nulos no JSON (default: always)
spring.jackson.default-property-inclusion=always
# Fuso horario aplicado a campos do tipo Date/Calendar
spring.jackson.time-zone=GMT-3

# -----------------------------------------------------------------------------
# DataSource (PostgreSQL)
# -----------------------------------------------------------------------------
# As variaveis abaixo possuem fallback para o valor apos ":". Em ambientes
# externos (Docker, deploy, etc.) basta exportar as variaveis de ambiente.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/hypeadvice}
spring.datasource.username=${DATABASE_USER:hypeadvice}
spring.datasource.password=${DATABASE_PASSWORD:hypeadvice}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------------------
# update: cria/atualiza o schema automaticamente. Suficiente para o teste
# tecnico; em producao recomenda-se 'validate' + migracoes (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
# Dialect mais alto disponivel no Hibernate 5.6.x compativel com Postgres 13+.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect
# Loga as queries SQL geradas. Util durante desenvolvimento.
spring.jpa.show-sql=true

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.example.hypeadvice=DEBUG


