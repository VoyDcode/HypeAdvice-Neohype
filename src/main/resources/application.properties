spring.jackson.date-format=dd/MM/yyyy HH:mm:ss
spring.jackson.default-property-inclusion=always
spring.jackson.time-zone=GMT-3

# As variaveis abaixo aceitam override via variavel de ambiente.
# A porta padrao e 5433 -- ajuste se seu PostgreSQL estiver na 5432.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/hypeadvice}
spring.datasource.username=${DATABASE_USER:hypeadvice}
spring.datasource.password=${DATABASE_PASSWORD:hypeadvice}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.show-sql=true

logging.level.root=INFO
logging.level.com.example.hypeadvice=DEBUG
